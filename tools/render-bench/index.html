<script type="module">
const q = new URLSearchParams(location.search)
document.documentElement.className = q.get('theme') || 'light'

const fx = (p) => 'fx/' + p.replace(/[^a-z0-9]/g, '_') + '.json'
const mod = await import('../../lib/client.js?' + Date.now())
let Page

  api: async (p, init) => { if (q.has('live')) return fetch('/api/ui/plugins/growth-studio/' + p, init); if (p.startsWith('i18n/') && window.__i18n) return new Response(JSON.stringify(window.__i18n)); const r = await fetch(fx(p)); return r.ok ? r : new Response(JSON.stringify({ posts: [] }), { status: 200 }) },

</script></body></html>
